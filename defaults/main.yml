---
# set the default values for the role

#########################
### Opam installation ###
#########################

# Installation method: 'package_manager' or 'direct' (using a verified release binary)
opam_install_method: direct

# Direct installation is Linux-only. Set these to a pinned release asset from:
# https://github.com/ocaml/opam/releases
opam_direct_url: ""
opam_direct_checksum: ""
opam_direct_destination: /usr/local/bin/opam

# Remove a package-manager installation before installing the direct binary.
opam_replace_package_managed: false

# External dependencies required for the installation
opam_external_dependencies:
  - patch
  - bubblewrap
  - gcc
  - make
  - unzip

# If a package manager is used, the package name
opam_package_name: opam

##########################
### Opam configuration ###
##########################

# Installation location: 'system_wide' or 'user'.
opam_install_location: system_wide

# The specific folder can be set below, but the user initialization will be done in the user's home directory without sudo to avoid permission issues

# In case of system-wide installation, the root location of the OPAM installation will only be writable by root/sudo
opam_root_location_system_wide: /opt/opam

# In case of user installation, the root location of the OPAM installation will be in the user's home directory and user-writable
opam_root_location_user: "{{ ansible_facts['env']['HOME'] + '/.opam' }}"
opam_user: "{{ ansible_facts['user_id'] }}"
#####################
### Opam packages ###
#####################

opam_switches: []
default_switch: ""
global_allow_invariant_updates: false

# Policy for an existing switch declared with compiler 'latest' when the
# installed compiler is older than the newest available one:
#   skip     keep the switch untouched (historical behaviour)
#   fail     abort the play like an explicit compiler mismatch
#   recreate remove and rebuild the switch with the newest compiler
# Can be overridden per switch with the latest_mismatch key.
opam_latest_mismatch: skip

#########################
### Post-installation ###
#########################

post_install_user: "{{ opam_user }}"

# user_setup configuration
configure_user_setup: false

# Jupyter
configure_jupyter: false
jupyter_switch: "default"

# VSCode
configure_vscode: false
vscode_executable_name: code
vscode_extensions:
  - "ocamllabs.ocaml-platform"
