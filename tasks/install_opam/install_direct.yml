- name: Install opam using direct installation
  when: opam_install_method == 'direct'
  become: true
  block:
    - name: Validate direct installation inputs
      ansible.builtin.assert:
        that:
          - ansible_system == 'Linux'
          - opam_direct_url | length > 0
          - opam_direct_url is match('^https://')
          - opam_direct_checksum is match('^sha256:[0-9a-fA-F]{64}$')
        fail_msg: >-
          Direct OPAM installation requires a pinned HTTPS Linux release URL and SHA-256
          checksum. Download a release binary from https://github.com/ocaml/opam/releases,
          then set opam_direct_url and opam_direct_checksum
          (sha256:<64-hex-character checksum>).

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Require explicit replacement of package-manager OPAM
      ansible.builtin.assert:
        that:
          - opam_package_name not in ansible_facts.packages or opam_replace_package_managed
        fail_msg: >-
          {{ opam_package_name }} is already installed by the system package manager.
          Set opam_replace_package_managed to true to remove it before the direct
          installation, or use opam_install_method: package_manager.

    - name: Remove package-manager OPAM when explicitly requested
      ansible.builtin.package:
        name: "{{ opam_package_name }}"
        state: absent
      when:
        - opam_replace_package_managed
        - opam_package_name in ansible_facts.packages

    - name: Install OPAM external dependencies
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop: "{{ opam_external_dependencies }}"

    - name: Download verified OPAM binary
      ansible.builtin.get_url:
        url: "{{ opam_direct_url }}"
        dest: "{{ opam_direct_destination }}"
        checksum: "{{ opam_direct_checksum }}"
        force: true
        owner: root
        group: root
        mode: "0755"
